# Not a distributable package: `package = false` means uv never builds or installs this.
# The file exists to hold tool config and the dev dependency group. Runtime dependencies
# live in each script's PEP 723 header, because `uv run --script` ignores this file.
[project]
name = "atlas-mcp"
version = "0"
description = "Org-wide repo atlas for Kiro CLI, served over MCP"
requires-python = ">=3.11"

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8", "mcp>=1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
# The codebase is written denser than ruff's 88-column default; 120 keeps the
# reformat from exploding expressions that read fine on one line.
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM"]
